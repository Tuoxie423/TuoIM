  /group/send:
    post:
      consumes:
      - application/json
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: 群消息参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.SendGroupMsgReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 发送群消息
      tags:
