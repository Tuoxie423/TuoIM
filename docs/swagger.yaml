      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
      summary: 更新用户资料
      tags:
      - 用户
  /users/search:
    get:
      parameters:
      - description: Bearer token
        in: header
